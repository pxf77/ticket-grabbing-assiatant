name: Apply Codex V2

on:
  push:
    branches:
      - codex/chengdu-ticket-assistant
    paths:
      - ".codex-apply/**"
      - ".github/workflows/apply-codex-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chengdu-ticket-assistant
          fetch-depth: 0

      - name: Reconstruct source archive
        run: |
          set -euo pipefail
          test -d .codex-apply
          ls -1 .codex-apply/v2.tar.gz.b64.* | sort
          cat $(ls -1 .codex-apply/v2.tar.gz.b64.* | sort) > /tmp/v2.tar.gz.b64
          base64 -d /tmp/v2.tar.gz.b64 > /tmp/v2.tar.gz
          mkdir -p /tmp/v2
          tar -xzf /tmp/v2.tar.gz -C /tmp/v2
          test -f /tmp/v2/chengdu-ticket-assistant-v2/package.json

      - name: Replace working tree with generated source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .codex-apply -exec rm -rf {} +
          cp -a /tmp/v2/chengdu-ticket-assistant-v2/. .
          rm -rf .codex-apply
          rm -f .github/workflows/apply-codex-v2.yml

      - name: Static validation without dependency install
        run: |
          set -euo pipefail
          node scripts/compliance-check.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('apps/api/package.json','utf8')); JSON.parse(require('fs').readFileSync('apps/web/package.json','utf8')); JSON.parse(require('fs').readFileSync('packages/shared/package.json','utf8')); console.log('package json parse passed')"

      - name: Commit final source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Chengdu ticket assistant runtime implementation" || exit 0
          git push origin HEAD:codex/chengdu-ticket-assistant
